services:
  backend:
    build: ./backend
    image: movie-backend
    env_file: ./backend/.env        # TMDB 키 (이미지에는 포함되지 않음)
    restart: unless-stopped
    expose:
      - "8000"                      # 외부 공개 X, compose 내부 네트워크에서만 접근
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    image: movie-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
